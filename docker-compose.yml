services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: studyrag
      POSTGRES_PASSWORD: studyrag
      POSTGRES_DB: studyrag
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyrag"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
